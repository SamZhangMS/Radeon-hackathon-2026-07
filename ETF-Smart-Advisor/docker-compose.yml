version: '3.8'

services:
  etf-advisor:
    build: .
    container_name: etf-advisor
    runtime: rocm
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    ipc: host
    shm_size: 8G
    ports:
      - "8000:8000"
      - "7860:7860"
    volumes:
      - ./data:/workspace/data
    environment:
      - ROCM_VISIBLE_DEVICES=0
      - OMP_NUM_THREADS=1
      - PYTHONPATH=/workspace
    command: bash scripts/start.sh